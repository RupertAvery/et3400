  <style>
/* github-markdown.css
   A GitHub-flavored Markdown stylesheet for use with pandoc's HTML output
   (e.g. via `-c github-markdown.css` or injected through a header include
   and used with wkhtmltopdf). Mimics GitHub's rendered .md appearance:
   fonts, spacing, headings, code blocks, tables, blockquotes, etc. */

body {
  margin: 0 auto;
  color: #1f2328;
  background-color: #ffffff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans",
    Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
  font-size: 16px;
  line-height: 1.5;
  word-wrap: break-word;
}

/* Headings */
h1, h2, h3, h4, h5, h6 {
  margin-top: 24px;
  margin-bottom: 16px;
  font-weight: 600;
  line-height: 1.25;
}

h1 {
  font-size: 2em;
  padding-bottom: 0.3em;
  border-bottom: 1px solid #d1d9e0;
}

h2 {
  font-size: 1.5em;
  padding-bottom: 0.3em;
  border-bottom: 1px solid #d1d9e0;
}

h3 { font-size: 1.25em; }
h4 { font-size: 1em; }
h5 { font-size: 0.875em; }
h6 {
  font-size: 0.85em;
  color: #59636e;
}

/* Paragraphs and lists */
p {
  margin-top: 0;
  margin-bottom: 16px;
}

ul, ol {
  margin-top: 0;
  margin-bottom: 16px;
  padding-left: 2em;
}

li + li {
  margin-top: 0.25em;
}

li > p {
  margin-top: 16px;
}

/* Links */
a {
  color: #0969da;
  text-decoration: none;
}

a:hover {
  text-decoration: underline;
}

/* Blockquotes */
blockquote {
  margin: 0 0 16px 0;
  padding: 0 1em;
  color: #59636e;
  border-left: 0.25em solid #d1d9e0;
}

blockquote > :first-child { margin-top: 0; }
blockquote > :last-child { margin-bottom: 0; }

/* Horizontal rule */
hr {
  height: 0.25em;
  padding: 0;
  margin: 24px 0;
  background-color: #d1d9e0;
  border: 0;
}

/* Inline code */
code, tt {
  padding: 0.2em 0.4em;
  margin: 0;
  font-size: 85%;
  white-space: break-spaces;
  background-color: #818b981f;
  border-radius: 6px;
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
    "Liberation Mono", monospace;
}

/* Code blocks */
pre {
  padding: 16px;
  overflow: auto;
  font-size: 85%;
  line-height: 1.45;
  background-color: #f6f8fa;
  border-radius: 6px;
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
    "Liberation Mono", monospace;
}

pre code, pre tt {
  padding: 0;
  margin: 0;
  background-color: transparent;
  border: 0;
  font-size: 100%;
  white-space: pre;
}

/* Tables */
table {
  border-spacing: 0;
  border-collapse: collapse;
  margin-top: 0;
  margin-bottom: 16px;
  width: max-content;
  max-width: 100%;
}

table th, table td {
  padding: 6px 13px;
  border: 1px solid #d1d9e0;
}

table th {
  font-weight: 600;
  background-color: #f6f8fa;
}

table tr {
  background-color: #ffffff;
  border-top: 1px solid #d1d9e0;
}

table tr:nth-child(2n) {
  background-color: #f6f8fa;
}

/* Images */
img {
  max-width: 100%;
  box-sizing: content-box;
  background-color: #ffffff;
}

/* Task lists (GFM) */
ul.task-list, ol.task-list {
  list-style: none;
  padding-left: 1.2em;
}

li.task-list-item {
  list-style-type: none;
}

input[type="checkbox"] {
  margin-right: 0.5em;
}

/* Definition lists */
dl {
  padding: 0;
}

dl dt {
  padding: 0;
  margin-top: 16px;
  font-size: 1em;
  font-style: italic;
  font-weight: 600;
}

dl dd {
  padding: 0 16px;
  margin-bottom: 16px;
}

/* Keyboard keys */
kbd {
  display: inline-block;
  padding: 3px 5px;
  font-size: 11px;
  line-height: 10px;
  color: #1f2328;
  vertical-align: middle;
  background-color: #f6f8fa;
  border: 1px solid #d1d9e0;
  border-radius: 6px;
  box-shadow: inset 0 -1px 0 #d1d9e0;
}

  </style>
